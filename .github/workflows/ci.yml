name: CI
on:
  push:
    branches: [main]
    paths:
      # Everything except prose. A change that only touches markdown, plan/ or
      # docs/ has nothing for these jobs to check — prettier covers src/ only,
      # and no test reads plan/ — so it skips the half-hour of builds.
      # The one exception: check-constants.mjs reads the pinned sd-server
      # version out of docs/image-generation.md, so that file still counts.
      - '**'
      - '!plan/**'
      - '!docs/**'
      - '!site/**'
      - '!audits/**'
      - '!**/*.md'
      - 'docs/image-generation.md'
  pull_request:
    # `labeled` so adding windows-ci / macos-ci starts that job straight away,
    # rather than on the PR's next push.
    types: [opened, synchronize, reopened, labeled]
    # The same list as push, spelled out: YAML anchors in workflows are recent
    # enough not to rely on.
    paths:
      - '**'
      - '!plan/**'
      - '!docs/**'
      - '!site/**'
      - '!audits/**'
      - '!**/*.md'
      - 'docs/image-generation.md'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    # A label changes nothing these jobs check; they ran on the push.
    if: github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test
      # Regression guard for the chat<->sandbox import cycle fixed in the
      # architecture audit (A1). madge can't resolve the #lib subpath import,
      # so it silently misses these cycles (audit A6) — a grep guard is the
      # reliable check. The sandbox/worker + sandbox-tool layers read ambient
      # state from stores/session.svelte + sandboxApproval.svelte, never from
      # the chat store.
      - name: Guard against chat<->sandbox import cycle
        run: |
          if grep -rn "stores/chat\.svelte" src/lib/sandbox/ src/lib/agent/tools/; then
            echo "::error::sandbox/ and agent/tools/ must not import the chat store — it reintroduces the chat<->sandbox cycle (see audits/architecture-2026-06-09.md, findings A1/A6). Read the ambient id/workdir from stores/session.svelte instead."
            exit 1
          fi
      # IPC drift guards (audit findings X2/X3): every TS invoke() literal
      # must name a command registered in lib.rs, and the generated command
      # constant must be current.
      - name: Check IPC command names
        run: node scripts/check-ipc.mjs
      # Ports/loopback are hand-synced across the IPC boundary (no codegen);
      # fail CI when src/lib/ports.ts and sidecar_utils.rs disagree.
      - name: Check hand-synced constants
        run: node scripts/check-constants.mjs
      # An externalBin nothing fetches fails the release build outright, and CI
      # cannot see it: CI stubs every sidecar, and the build matrix only runs
      # when a tag is cut. Checked here so the gap surfaces before the tag.
      - name: Check sidecar release coverage
        run: node scripts/check-sidecar-coverage.mjs

  # UI flows in a real browser, against mocked IPC and the scripted fake LLM
  # (e2e/, docs/testing.md). Inside the pinned Playwright image, so the
  # visual baselines are compared on the renderer that made them; keep the tag
  # in step with @playwright/test and scripts/e2e-ui-visual.sh.
  e2e-ui:
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled'
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # Playwright's own advice for this image under Actions.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: The test mocks stay out of a production build
        run: |
          npm run build
          if grep -rl 'no mock for IPC command' build/; then
            echo "src/lib/e2e reached the production build"
            exit 1
          fi
      - name: UI flows and screenshots
        run: npx playwright test
        env:
          E2E_VISUAL: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  backend:
    runs-on: ubuntu-latest
    # A label changes nothing these jobs check; they ran on the push.
    if: github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Some runner images ship a `cargo` shim in /usr/local/bin that's
      # actually rustup-init; without this, that shim wins over the real
      # cargo dtolnay installs at ~/.cargo/bin and `cargo build` fails
      # with `unexpected argument 'build' found` from rustup-init.
      - name: Ensure cargo on PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxcb1-dev

      - name: Create placeholder sidecar binaries and libs
        run: scripts/ci-placeholder-sidecars.sh

      # --locked turns a stale Cargo.lock into a hard failure instead of a
      # silent in-CI regeneration. This is the guard that keeps release-please
      # PRs from merging with an unsynced lockfile: the release PR bumps
      # Cargo.toml, so this check stays red until release.yml's
      # sync-cargo-lock job pushes the matching lockfile commit (merging
      # inside that job's ~20s window is what let v0.1.53 land with a stale
      # lock). It equally catches human PRs that bump a dep without
      # committing the lockfile.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # ts-rs bindings freshness (audit finding X3): the committed
      # src/lib/ipc/gen/ types must match what the Rust structs generate.
      # cargo test above already ran the export tests (into the gitignored
      # default dir); this re-export targets the committed location.
      - name: Check generated IPC types are current
        run: |
          TS_RS_EXPORT_DIR="$PWD/src/lib/ipc/gen" cargo test --manifest-path src-tauri/Cargo.toml export_bindings
          git diff --exit-code -- src/lib/ipc/gen || {
            echo "::error::src/lib/ipc/gen is stale — run scripts/export-ipc-types.sh and commit the result."
            exit 1
          }

  # The built app, driven through WebDriver (tauri-driver + WebKitWebDriver,
  # under Xvfb) with the model scripted and every sidecar a stub: chat, a tool
  # call writing to disk, a ComfyUI test image, and a sidecar dying with the
  # app. See e2e/app/ and docs/testing.md.
  e2e-app:
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure cargo on PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target-e2e
          cache-bin: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxcb1-dev \
            webkit2gtk-driver \
            xvfb
      - run: scripts/ci-placeholder-sidecars.sh
      - run: npm ci
      - run: cargo install tauri-driver --locked
      - run: npm run e2e:app:build
      - run: xvfb-run -a npm run e2e:app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-app-linux
          path: e2e/app/output/

  # Windows gates for the Shell-tab port (Phase 17). The whole point is to
  # compile + lint the `#[cfg(windows)]` branches (code_tools.rs, sidecar_utils.rs,
  # and the upcoming catalog/winps/wsl modules) that the Linux `backend` job never
  # touches, plus the type-check + unit tests against Windows path/line-ending
  # behavior. Single combined job — Windows runner minutes bill at a higher rate
  # than the Linux frontend/backend split.
  #
  # It's slow (~15 min), so it does NOT run on every PR push. It runs when the
  # `windows-ci` label is added to a PR, on every later push to a PR that
  # carries it (Shell-tab, fs_tools, sidecar and other
  # platform-specific work), on a manual dispatch (Actions tab → CI → Run
  # workflow), and after every merge to main, which catches anything nobody
  # labelled.
  windows:
    runs-on: windows-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event.action == 'labeled' && github.event.label.name == 'windows-ci') ||
      (github.event.action != 'labeled' &&
        contains(github.event.pull_request.labels.*.name, 'windows-ci'))
    steps:
      # Check out with LF intact so rustfmt/prettier and `git diff` aren't fooled
      # by CRLF churn on the Windows runner (autocrlf defaults to true there).
      - name: Disable autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-check + unit tests catch Windows-specific path / line-ending logic
      # bugs (cf. the CRLF pyodide-resolver fix). lint/format:check are
      # platform-independent and already covered by the ubuntu `frontend` job.
      - run: npm run check
      - run: npm run test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # windows-latest already ships the MSVC C++ build tools + WebView2, so no
      # system-dependency install step is needed (unlike the Linux backend job).

      - name: Create placeholder sidecar binaries and libs
        shell: pwsh
        run: |
          $target = (rustc --print host-tuple)
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          foreach ($name in 'haruspex-llama-server', 'haruspex-whisper-server', 'haruspex-koko', 'haruspex-ruff', 'haruspex-node', 'haruspex-uv', 'haruspex-sd-server') {
            # externalBin resolves to `<name>-<triple>.exe` on Windows.
            Set-Content -Path "src-tauri/binaries/$name-$target.exe" -Value '@echo off'
          }
          # Placeholder dirs/files for the resources globs in tauri.conf.json.
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/node-modules | Out-Null
          Set-Content -Path src-tauri/binaries/node-modules/.placeholder -Value ''
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/libs | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/sd-libs | Out-Null
          Set-Content -Path src-tauri/binaries/sd-libs/.placeholder -Value ''
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/espeak-ng-data/lang/placeholder | Out-Null
          Set-Content -Path src-tauri/binaries/libs/.placeholder -Value ''
          Set-Content -Path src-tauri/binaries/espeak-ng-data/.placeholder -Value ''
          Set-Content -Path src-tauri/binaries/espeak-ng-data/lang/.placeholder -Value ''
          Set-Content -Path src-tauri/binaries/espeak-ng-data/lang/placeholder/.placeholder -Value ''

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # No real-app tests here: on this hosted runner WebView2 never opens the
      # debugging port msedgedriver waits for ("DevToolsActivePort file doesn't
      # exist"), although the same build passes on a desktop Windows PC. They
      # run on the self-hosted Windows test machine instead
      # (scripts/ci-runner, suite e2e-app).

  # macOS gates, the counterpart of the Windows job: compile, lint and test the
  # `#[cfg(target_os = "macos")]` branches (screen capture, the orphan sweep's
  # `ps` probe, Metal paths) that neither the Linux nor the Windows job builds.
  # macos-latest is Apple Silicon, the platform the bundled engines target.
  # Slow too, so the same triggers as Windows, with the `macos-ci` label.
  macos:
    runs-on: macos-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event.action == 'labeled' && github.event.label.name == 'macos-ci') ||
      (github.event.action != 'labeled' &&
        contains(github.event.pull_request.labels.*.name, 'macos-ci'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint/format:check are platform-independent and covered by `frontend`.
      - run: npm run check
      - run: npm run test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Ensure cargo on PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # macos-latest ships Xcode's toolchain and WebKit, so no system-dependency
      # install step is needed.

      - name: Create placeholder sidecar binaries and libs
        run: |
          TARGET=$(rustc --print host-tuple)
          mkdir -p src-tauri/binaries
          for name in haruspex-llama-server haruspex-whisper-server haruspex-koko haruspex-ruff haruspex-node haruspex-uv haruspex-sd-server; do
            echo '#!/bin/sh' > "src-tauri/binaries/${name}-${TARGET}"
            chmod +x "src-tauri/binaries/${name}-${TARGET}"
          done
          mkdir -p src-tauri/binaries/node-modules src-tauri/binaries/libs src-tauri/binaries/sd-libs
          touch src-tauri/binaries/node-modules/.placeholder src-tauri/binaries/libs/.placeholder src-tauri/binaries/sd-libs/.placeholder
          mkdir -p src-tauri/binaries/espeak-ng-data/lang/placeholder
          touch src-tauri/binaries/espeak-ng-data/.placeholder
          touch src-tauri/binaries/espeak-ng-data/lang/.placeholder
          touch src-tauri/binaries/espeak-ng-data/lang/placeholder/.placeholder

      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
