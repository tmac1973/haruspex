name: pages

# The public site in site/: home page, privacy policy, terms of service, and
# the user guide, rendered from docs/guide/ into site/guide/ at publish time,
# and Things you can do, from docs/showcase/ into site/showcase/.
# Google's OAuth consent screen links to these, so they must stay reachable
# at https://haruspex.spronglehump.com/. See docs/google-sign-in.md.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/guide/**'
      - 'docs/showcase/**'
      - 'scripts/build-guide.mjs'
      - 'scripts/build-showcase.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Build and deploy are separate jobs. In one job, deploy-pages ran a few
# milliseconds after the upload and sometimes found no artifact yet ("No
# artifacts named github-pages"), so the site silently stayed on an old build.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Only `marked` is needed; --ignore-scripts skips every install hook.
      - run: npm ci --ignore-scripts
      # The user guide: docs/guide/*.md rendered into site/guide/.
      - run: node scripts/build-guide.mjs
      # Things you can do: docs/showcase/*.md rendered into site/showcase/.
      - run: node scripts/build-showcase.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
